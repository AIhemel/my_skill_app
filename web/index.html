<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1222">
  <title>SkillBoost</title>
  <link rel="icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="back-btn" class="icon-btn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="title-wrap">
        <div id="page-title">SkillBoost</div>
      </div>
      <div id="top-stats">
        <span class="chip streak-chip" id="streak-chip" title="Day streak">🔥 <b>0</b></span>
        <button class="chip level-chip" id="level-chip" aria-label="Profile">⚡ <b>1</b></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav id="tabbar">
      <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
      <a href="#/words" data-tab="words"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5"/></svg><span>Words</span></a>
      <a href="#/code" data-tab="code"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span>Code</span></a>
      <a href="#/verbal" data-tab="verbal"><svg viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg><span>Verbal</span></a>
      <a href="#/calm" data-tab="calm"><svg viewBox="0 0 24 24"><path d="M12 21c-4-3-7-6.5-7-10.5A7 7 0 0 1 12 3a7 7 0 0 1 7 7.5c0 4-3 7.5-7 10.5zM12 21V10"/></svg><span>Calm</span></a>
    </nav>
  </div>
  <div id="toast-host"></div>
  <div id="modal-host"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- C compiler + virtual microcontroller -->
  <script src="js/minic/pp.js"></script>
  <script src="js/minic/parse.js"></script>
  <script src="js/minic/vm.js"></script>
  <script src="js/minic/grader.js"></script>
  <!-- content -->
  <script src="js/data/vocab-gre-1.js"></script>
  <script src="js/data/vocab-gre-2.js"></script>
  <script src="js/data/vocab-gre-3.js"></script>
  <script src="js/data/vocab-gre-4.js"></script>
  <script src="js/data/vocab-ielts.js"></script>
  <script src="js/data/verbal.js"></script>
  <script src="js/data/ielts.js"></script>
  <script src="js/data/lessons-1.js"></script>
  <script src="js/data/lessons-2.js"></script>
  <script src="js/data/lessons-3.js"></script>
  <script src="js/data/calm.js"></script>
  <!-- app -->
  <script src="js/core.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/boardview.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/words.js"></script>
  <script src="js/views/code.js"></script>
  <script src="js/views/verbal.js"></script>
  <script src="js/views/calm.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
